<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig PM Pro Demo | Asset & Maintenance Tracker</title>
<meta name="description" content="Demo of Rig PM Pro - track preventive maintenance for your truck, APU, trailer, and reefer.">
<style>
  :root {
    --ink: #eef2f7;
    --muted: #b6c0cc;
    --paper: #11161c;
    --soft: #1a212a;
    --line: #2d3742;
    --blue: #1d4f91;
    --orange: #e8741c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
  }

  main { display: block; }

  .demo-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: var(--paper);
    color: var(--ink);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .demo-header {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .demo-header h1 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
  }

  .demo-back {
    background: var(--blue);
    color: #fff;
    border: 0;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .demo-back:hover {
    opacity: 0.9;
  }

  /* Main content area */
  .demo-content {
    display: flex;
    flex: 1;
    overflow: hidden;
    gap: 0;
  }

  /* Left category menu */
  .demo-categories {
    width: 200px;
    background: var(--soft);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 12px 0;
  }

  .demo-category-item {
    padding: 12px 16px;
    border: 0;
    background: none;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    font-size: 0.95rem;
    border-left: 3px solid transparent;
    transition: background 0.2s;
  }

  .demo-category-item:hover {
    background: var(--line);
  }

  .demo-category-item.active {
    background: var(--line);
    border-left-color: var(--orange);
    font-weight: 600;
  }

  /* Right content panel */
  .demo-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .demo-panel-header {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    padding: 16px;
  }

  .demo-panel-header h2 {
    margin: 0 0 8px;
    font-size: 1.3rem;
  }

  .demo-panel-header p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .demo-content-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .demo-placards {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(2, 1fr);
  }

  .demo-placard {
    background: linear-gradient(135deg, var(--soft) 0%, rgba(26, 33, 42, 0.8) 100%);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 140px;
  }

  .demo-placard:hover {
    border-color: var(--orange);
    background: linear-gradient(135deg, var(--line) 0%, var(--soft) 100%);
    transform: translateY(-4px);
    box-shadow: 0 8px 16px rgba(232, 116, 28, 0.2);
  }

  .demo-placard-title {
    font-weight: 700;
    font-size: 1.2rem;
    margin-bottom: 8px;
    color: #fff;
  }

  .demo-placard-desc {
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.4;
  }

  @media (max-width: 768px) {
    .demo-placards {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .demo-placard {
      min-height: 120px;
      padding: 20px;
    }

    .demo-placard-title {
      font-size: 1.1rem;
    }
  }

  @media (max-width: 480px) {
    .demo-placard {
      min-height: 110px;
      padding: 16px;
    }

    .demo-placard-title {
      font-size: 1rem;
    }

    .demo-placard-desc {
      font-size: 0.8rem;
    }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .demo-categories {
      width: 150px;
    }

    .demo-header {
      padding: 12px;
    }

    .demo-header h1 {
      font-size: 1.2rem;
    }

    .demo-panel-header {
      padding: 12px;
    }

    .demo-content-area {
      padding: 12px;
    }
  }

  @media (max-width: 480px) {
    .demo-categories {
      width: 120px;
    }

    .demo-category-item {
      padding: 10px 12px;
      font-size: 0.9rem;
    }

    .demo-header h1 {
      font-size: 1rem;
    }

    .demo-back {
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .demo-placard {
      padding: 12px;
    }

    .demo-panel-header h2 {
      font-size: 1.1rem;
    }

    .demo-placard-title {
      font-size: 0.95rem;
    }
  }
</style>
</head>
<body>

<div class="demo-container">
  <!-- Header -->
  <div class="demo-header">
    <h1>Rig PM Pro Demo</h1>
    <button class="demo-back" onclick="exitDemo()">Exit Demo</button>
  </div>

  <!-- Main Content -->
  <div class="demo-content">
    <!-- Left Category Menu -->
    <div class="demo-categories">
      <button class="demo-category-item active" onclick="selectCategory('assets')">Assets</button>
      <button class="demo-category-item" onclick="selectCategory('maintenance')">Maintenance</button>
      <button class="demo-category-item" onclick="selectCategory('account')">Account Settings</button>
    </div>

    <!-- Right Content Panel -->
    <div class="demo-panel">
      <div id="panel-content"></div>
    </div>
  </div>
</div>

<script>
  const demoContent = {
    assets: {
      title: 'Assets',
      desc: 'Manage your trucks, trailers, APU, and reefer units',
      placards: [
        { title: 'Add Asset', desc: 'Add a new truck, trailer, APU, or reefer to track' },
        { title: 'Edit Asset', desc: 'Update details for your existing equipment' },
        { title: 'View All Assets', desc: 'See all your equipment in one place' },
        { title: 'Asset History', desc: 'View maintenance history by asset' }
      ]
    },
    maintenance: {
      title: 'Maintenance',
      desc: 'Log and track preventive maintenance across all assets',
      placards: [
        { title: 'Log PM', desc: 'Record a completed preventive maintenance task' },
        { title: 'Log Repair', desc: 'Log an unplanned repair or service' },
        { title: 'Repair History', desc: 'View all repairs by asset or date' },
        { title: 'Total Costs', desc: 'See maintenance spending by month, quarter, or year' }
      ]
    },
    account: {
      title: 'Account Settings',
      desc: 'Manage your account, billing, and preferences',
      placards: [
        { title: 'Profile', desc: 'Update your name, email, and contact information' },
        { title: 'Billing & Subscription', desc: 'Manage your plan, payment method, and receipts' },
        { title: 'Preferences', desc: 'Set notifications, export options, and display preferences' },
        { title: 'Support', desc: 'Contact support or view documentation' }
      ]
    }
  };

  function selectCategory(category) {
    // Update active button
    document.querySelectorAll('.demo-category-item').forEach(btn => {
      btn.classList.remove('active');
      if (btn.textContent.toLowerCase() === category.toLowerCase()) {
        btn.classList.add('active');
      }
    });

    // Render content
    const content = demoContent[category];
    const panelContent = document.getElementById('panel-content');

    let html = `
      <div class="demo-panel-header">
        <h2>${content.title}</h2>
        <p>${content.desc}</p>
      </div>
      <div class="demo-content-area">
        <div class="demo-placards">
    `;

    content.placards.forEach(placard => {
      html += `
        <div class="demo-placard" onclick="alert('${placard.title}: ${placard.desc}')">
          <div class="demo-placard-title">${placard.title}</div>
          <div class="demo-placard-desc">${placard.desc}</div>
        </div>
      `;
    });

    html += `
        </div>
      </div>
    `;

    panelContent.innerHTML = html;
  }

  function exitDemo() {
    window.location.href = '/';
  }

  // Initialize with Assets category on load
  window.addEventListener('load', () => {
    selectCategory('assets');
  });
</script>

</body>
</html>
