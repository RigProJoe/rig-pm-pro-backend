<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig PM Pro Demo | Asset & Maintenance Tracker</title>
<style>
  :root {
    --ink: #eef2f7;
    --muted: #b6c0cc;
    --paper: #11161c;
    --soft: #1a212a;
    --line: #2d3742;
    --blue: #1d4f91;
    --orange: #e8741c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
  }

  .demo-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .demo-header {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .demo-header h1 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
  }

  .demo-exit-btn {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  .demo-exit-btn:hover { background: var(--line); }

  .demo-menu-toggle-btn {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .demo-menu-toggle-btn:hover { background: var(--line); }

  .demo-content {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .demo-sidebar {
    width: 200px;
    background: var(--soft);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 12px 0;
  }

  .demo-nav-btn {
    width: 100%;
    padding: 12px 16px;
    border: 0;
    background: none;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    font-size: 0.95rem;
    border-left: 3px solid transparent;
    transition: background 0.2s;
  }

  .demo-nav-btn:hover { background: var(--line); }

  .demo-nav-btn.active {
    background: var(--line);
    border-left-color: var(--orange);
    font-weight: 600;
  }

  .demo-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .demo-panel-header {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .demo-panel-header h2 {
    margin: 0 0 6px;
    font-size: 1.3rem !important;
  }

  .demo-panel-header p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .demo-back-btn {
    background: var(--blue);
    color: #fff;
    border: 0;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
  }

  .demo-back-btn:hover { opacity: 0.9; }

  .demo-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
    min-height: 0;
  }

  .demo-placards {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(2, 1fr);
  }

  .demo-placard {
    background: linear-gradient(135deg, var(--soft) 0%, rgba(26, 33, 42, 0.8) 100%);
    border: 2px solid #FFD700;
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 60px;
  }

  .demo-placard:hover {
    border-color: var(--orange);
    background: linear-gradient(135deg, var(--line) 0%, var(--soft) 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(232, 116, 28, 0.2);
  }

  .demo-placard-title {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 4px;
    color: #fff;
  }

  .demo-placard-desc {
    display: none;
  }

  .demo-form {
    max-width: 600px;
    margin: 0 auto;
  }

  .demo-form-group {
    margin-bottom: 18px;
  }

  .demo-form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .demo-form-group input,
  .demo-form-group select {
    width: 100%;
    padding: 10px 12px;
    background: var(--soft);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
  }

  .asset-form-section {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    align-items: flex-end;
  }

  .asset-form-section h3 {
    grid-column: 1 / -1;
    margin: 0 0 8px;
    font-size: 1.1rem;
    color: var(--orange);
    border-bottom: 2px solid var(--line);
    padding-bottom: 12px;
  }

  .asset-form-section .demo-form-group {
    margin-bottom: 0;
  }

  .asset-form-section .demo-form-group label {
    font-size: 0.75rem;
    margin-bottom: 4px;
  }

  .asset-form-section .demo-form-group input {
    padding: 8px;
    font-size: 0.9rem;
  }

  .demo-form-group input:focus,
  .demo-form-group select:focus {
    outline: none;
    border-color: var(--orange);
  }

  .demo-form-buttons {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .demo-save-btn {
    background: var(--orange);
    color: #fff;
    border: 0;
    padding: 12px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    flex: 1;
  }

  .demo-save-btn:hover { opacity: 0.9; }

  .demo-cancel-btn {
    background: transparent;
    color: var(--orange);
    border: 2px solid var(--orange);
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  .demo-cancel-btn:hover { background: rgba(232, 116, 28, 0.1); }

  /* Responsive Asset Choice Container - 4-button Add Asset selection screen
     Portrait phone (<768px): 2x2 grid, standard button size
     Landscape phone (<768px, landscape): 2x2 grid, SCALED DOWN to fit viewport without scroll
     Tablet (768-899px): 2x2 grid, standard size
     Desktop (900px+): 2x2 grid, standard size */
  .asset-choice-container {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(2, 1fr);
    max-width: 600px;
    margin: 0 auto;
  }

  /* Standard button size for portrait phone and larger screens */
  .asset-choice-btn {
    background: linear-gradient(135deg, var(--soft) 0%, rgba(26, 33, 42, 0.8) 100%);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 120px;
    color: var(--ink);
    font-weight: 600;
    font-size: 1.1rem;
  }

  .asset-choice-btn:hover {
    border-color: var(--orange);
    background: linear-gradient(135deg, var(--line) 0%, var(--soft) 100%);
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(232, 116, 28, 0.3);
  }

  /* LANDSCAPE PHONE: Scale down buttons to fit all 4 without scrolling */
  @media (max-width: 767px) and (orientation: landscape) {
    .asset-choice-container {
      gap: 8px;
    }

    .asset-choice-btn {
      padding: 12px;
      min-height: 80px;
      font-size: 0.9rem;
      border-radius: 8px;
    }
  }

  .asset-cards-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  .asset-card {
    background: var(--soft);
    border: 2px solid #FFD700 !important;
    border-radius: 8px;
    padding: 12px;
    transition: all 0.3s ease;
  }

  .asset-card-active {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(232, 116, 28, 0.2);
  }

  .asset-card-completed {
    background: rgba(100, 120, 140, 0.3);
    opacity: 0.6;
  }

  .asset-card h3 {
    margin: 0 0 10px;
    font-size: 1.5rem !important;
    color: #FFFF00 !important;
    font-weight: 700;
    border-bottom: 2px solid var(--line);
    padding-bottom: 12px;
  }

  .asset-card-content {
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .form-field {
    margin-bottom: 8px;
  }

  .form-field label {
    display: block;
    margin-bottom: 3px;
    font-weight: 700;
    font-size: 0.8rem !important;
    color: #FFFF00 !important;
  }

  .form-field input {
    width: 100%;
    max-width: 100px;
    padding: 6px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.9rem;
  }

  .form-field input:focus {
    outline: none;
    border-color: var(--orange);
  }

  /* Hide number input spinners - user input only */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  input[type="number"] {
    -moz-appearance: textfield;
  }

  /* Field-specific widths */
  input[data-field="year"] {
    max-width: 70px;
  }

  input[data-field="make"] {
    max-width: 220px;
  }

  input[data-field="model"] {
    max-width: 220px;
  }

  input[data-field="make"],
  input[data-field="model"] {
    overflow: hidden;
    text-overflow: clip;
    font-size: 0.85rem;
  }

  input[data-field="unit"] {
    max-width: 80px;
  }

  input[data-field="vin"] {
    max-width: 80px;
  }

  .form-field input:disabled {
    background: var(--line);
    opacity: 0.5;
    cursor: not-allowed;
  }

  .asset-card-buttons {
    display: flex;
    gap: 6px;
    justify-content: flex-end !important;
    margin-top: 8px;
  }

  .btn-save, .btn-clear, .btn-cancel {
    flex: 0 0 auto;
    padding: 4px 8px !important;
    border: 0;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.8rem !important;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-save {
    background: var(--orange) !important;
    color: #fff !important;
    display: inline-block !important;
    visibility: visible !important;
  }

  .btn-save:hover:not(:disabled) {
    opacity: 0.9;
  }

  .btn-save:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-clear {
    background: transparent !important;
    color: #FFFF00 !important;
    border: 1px solid #FFFF00 !important;
    display: inline-block !important;
    visibility: visible !important;
  }

  .btn-clear:hover:not(:disabled) {
    background: rgba(255, 255, 0, 0.15) !important;
    color: #FFFF00 !important;
    border-color: #FFFF00 !important;
  }

  .btn-clear:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-cancel {
    background: transparent !important;
    color: var(--orange) !important;
    border: 1px solid var(--orange) !important;
    display: inline-block !important;
    visibility: visible !important;
  }

  .btn-cancel:hover {
    background: rgba(232, 116, 28, 0.1) !important;
  }

  .multi-asset-form {
    display: grid;
    gap: 32px;
    grid-template-columns: repeat(2, 1fr);
  }

  .asset-form-section {
    background: var(--soft);
    border: 2px solid #FFD700;
    border-radius: 8px;
    padding: 20px;
  }



  @media (min-width: 900px) {
    .demo-placards { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 899px) {
    .multi-asset-form {
      grid-template-columns: 1fr;
    }

    /* Sidebar becomes an overlay drawer on phone AND tablet - text stays visible.
       Auto-hides on category selection for consistency across both breakpoints. */
    .demo-sidebar {
      position: fixed;
      left: 0;
      top: 60px;
      height: calc(100% - 60px);
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      box-shadow: 2px 0 12px rgba(0,0,0,0.4);
    }

    .demo-sidebar.visible {
      transform: translateX(0);
    }

    /* Show menu toggle button on phone and tablet */
    .demo-menu-toggle-btn { display: flex; }

    /* Adjust main content on phone and tablet */
    .demo-content {
      width: 100%;
    }

    .demo-main {
      width: 100%;
    }
  }

  /* Tablet-only sidebar width (phone gets its own orientation-based widths below) */
  @media (min-width: 768px) and (max-width: 899px) {
    .demo-sidebar { width: 280px; }
  }

  @media (max-width: 767px) {
    /* Keep title on one line - buttons on both sides were squeezing it to wrap */
    .demo-header {
      padding: 10px 8px;
      gap: 6px;
    }

    .demo-header h1 {
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    .demo-exit-btn,
    .demo-menu-toggle-btn {
      flex-shrink: 0;
      white-space: nowrap;
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    /* Hide all panel header titles/descriptions on phone at every step - maximizes space for cards/forms */
    .demo-panel-header h2,
    .demo-panel-header p {
      display: none;
    }

    /* Collapse header padding since text is gone (keeps Back button comfortable) */
    .demo-panel-header {
      padding: 10px 16px;
    }
  }

  /* Sidebar width scales by orientation */
  @media (max-width: 767px) and (orientation: portrait) {
    .demo-sidebar { width: 200px; }
  }

  @media (max-width: 767px) and (orientation: landscape) {
    .demo-sidebar { width: 240px; }
  }

  @media (max-width: 480px) {
    .demo-sidebar { width: 170px; }
    .demo-nav-btn { padding: 10px 12px; }
    .demo-header h1 { font-size: 0.85rem; }
    .demo-exit-btn,
    .demo-menu-toggle-btn { font-size: 0.75rem; padding: 6px 8px; }
    .demo-placards { grid-template-columns: 1fr; }
    .demo-placard { min-height: 55px; padding: 12px; }
    .demo-placard-title { font-size: 0.95rem; margin-bottom: 2px; }
    .demo-placard-desc { font-size: 0.75rem; }
    .asset-choice-container { gap: 12px; }
    .asset-choice-btn { min-height: 100px; padding: 16px; font-size: 1rem; }
  }
</style>
</head>
<body>

<div class="demo-container">
  <div class="demo-header">
    <button class="demo-menu-toggle-btn" id="menuToggleBtn" onclick="toggleMenu()">Close Menu</button>
    <h1>Rig PM Pro Demo</h1>
    <button class="demo-exit-btn" onclick="exitDemo()">Exit Demo</button>
  </div>

  <div class="demo-content">
    <div class="demo-sidebar">
      <button class="demo-nav-btn active" onclick="selectCategory('pminfo')">PM Info</button>
      <button class="demo-nav-btn" onclick="selectCategory('assets')">Assets</button>
      <button class="demo-nav-btn" onclick="selectCategory('maintenance')">Maintenance</button>
      <button class="demo-nav-btn" onclick="selectCategory('account')">Account Settings</button>
    </div>

    <div class="demo-main">
      <div id="panel-header"></div>
      <div class="demo-area" id="panel-content"></div>
    </div>
  </div>
</div>

<script>
  let previousCategory = null;
  let demoState = { page: 'home', category: null, action: null };
  let isInitialLoad = true;
  let menuVisible = true;

  function toggleMenu() {
    if (menuVisible) {
      hideMenu();
    } else {
      showMenu();
    }
  }

  function hideMenu() {
    const sidebar = document.querySelector('.demo-sidebar');
    const btn = document.getElementById('menuToggleBtn');
    sidebar.classList.remove('visible');
    menuVisible = false;
    btn.textContent = 'Open Menu';
  }

  function showMenu() {
    const sidebar = document.querySelector('.demo-sidebar');
    const btn = document.getElementById('menuToggleBtn');
    sidebar.classList.add('visible');
    menuVisible = true;
    btn.textContent = 'Close Menu';
  }

  function initMenuState() {
    const sidebar = document.querySelector('.demo-sidebar');
    const btn = document.getElementById('menuToggleBtn');
    // Menu starts open by default on phone (both orientations)
    sidebar.classList.add('visible');
    menuVisible = true;
    if (btn) btn.textContent = 'Close Menu';
  }

  // Manage browser history to keep demo alive
  function pushDemoState(state) {
    demoState = state;
    window.history.pushState(state, '', window.location.href);
  }

  // Handle browser back button
  window.addEventListener('popstate', (event) => {
    if (event.state) {
      demoState = event.state;
      if (event.state.page === 'placards' && event.state.category === 'pminfo') {
        showPMInfoEntry();
      } else if (event.state.page === 'placards' && event.state.category) {
        showPlacards(event.state.category);
      } else if (event.state.page === 'home') {
        selectCategory('pminfo');
      }
    }
  });

  // Determine auto entry point based on asset state
  function getAutoEntryPoint() {
    const assets = loadAssetsFromLocalStorage();
    return assets.length === 0 ? 'assets' : 'pminfo';
  }

  // Push initial state
  window.addEventListener('load', () => {
    const entryPoint = getAutoEntryPoint();
    pushDemoState({ page: 'home', category: null, action: null });
    selectCategory(entryPoint);
  });

  const categories = {
    assets: {
      title: 'Assets',
      desc: 'Manage your trucks, trailers, APU, and reefer units',
      placards: [
        { title: 'Add Asset', desc: 'Add a new truck, trailer, APU, or reefer to track', action: 'add-asset' },
        { title: 'View Assets', desc: 'See all your equipment in one place', action: 'view-assets' }
      ]
    },
    maintenance: {
      title: 'Maintenance',
      desc: 'Log and track preventive maintenance across all assets',
      placards: [
        { title: 'Log Repair/PM', desc: 'Record preventive maintenance or repairs', action: 'log-repair' },
        { title: 'Repair History', desc: 'View all repairs by asset or date', action: 'repair-history' },
        { title: 'Total Costs', desc: 'See maintenance spending by month, quarter, or year', action: 'total-costs' }
      ]
    },
    account: {
      title: 'Account Settings',
      desc: 'Manage your account, billing, and preferences',
      placards: [
        { title: 'Profile', desc: 'Update your name, email, and contact information', action: 'profile' },
        { title: 'Billing & Subscription', desc: 'Manage your plan, payment method, and receipts', action: 'billing' },
        { title: 'Preferences', desc: 'Set notifications, export options, and display preferences', action: 'preferences' },
        { title: 'Support', desc: 'Contact support or view documentation', action: 'support' }
      ]
    }
  };

  function selectCategory(cat) {
    previousCategory = cat;
    pushDemoState({ page: 'placards', category: cat, action: null });

    document.querySelectorAll('.demo-nav-btn').forEach(btn => {
      btn.classList.remove('active');
      if (btn.textContent.toLowerCase() === cat.toLowerCase() ||
          (cat === 'pminfo' && btn.innerHTML.includes('PM Info')) ||
          (cat === 'assets' && btn.innerHTML.includes('Assets')) ||
          (cat === 'maintenance' && btn.innerHTML.includes('Maintenance')) ||
          (cat === 'account' && btn.innerHTML.includes('Account'))) {
        btn.classList.add('active');
      }
    });

    // Hide menu after category selection (but not on initial load)
    if (!isInitialLoad) {
      hideMenu();
    }
    isInitialLoad = false;

    if (cat === 'pminfo') {
      showPMInfoEntry();
    } else {
      showPlacards(cat);
    }
  }

  function showPlacards(cat) {
    const content = categories[cat];
    const header = document.getElementById('panel-header');
    const panel = document.getElementById('panel-content');
    const assets = loadAssetsFromLocalStorage();

    // Customize description for Assets category when no assets exist
    let displayDesc = content.desc;
    if (cat === 'assets' && assets.length === 0) {
      displayDesc = 'Enter your first asset to begin';
    }

    header.innerHTML = `
      <div class="demo-panel-header category-level-header">
        <div>
          <h2>${content.title}</h2>
          <p>${displayDesc}</p>
        </div>
      </div>
    `;

    let html = '<div class="demo-placards">';
    content.placards.forEach(p => {
      // Disable "View Assets" card if no assets exist
      const isViewAssetsDisabled = (p.action === 'view-assets' && assets.length === 0);
      const disabledStyle = isViewAssetsDisabled ? 'opacity: 0.5; cursor: not-allowed;' : '';
      const onClickHandler = isViewAssetsDisabled ? '' : `openForm('${p.action}', '${p.title}')`;

      html += `
        <div class="demo-placard" onclick="${onClickHandler}" style="${disabledStyle}">
          <div class="demo-placard-title">${p.title}</div>
          <div class="demo-placard-desc">${p.desc}</div>
        </div>
      `;
    });
    html += '</div>';

    panel.innerHTML = html;
  }

  let currentAssetAction = null;

  // Build #33: Show the 4-button Add Asset selection screen
  // Flow: User clicks one of the four "Add" buttons → opens form for that asset type →
  //        user fills in details → clicks Save → returns to this screen (4-button selection)
  //
  // Responsive breakpoints:
  // - Portrait phone (<768px): 2x2 grid, standard button size (120px min-height, 24px padding, 1.1rem font)
  // - Landscape phone (<768px, landscape): 2x2 grid, SCALED DOWN (80px min-height, 12px padding, 0.9rem font)
  //   to ensure all 4 buttons fit in viewport without vertical scrolling
  // - Tablet (768-899px): 2x2 grid, standard size
  // - Desktop (900px+): 2x2 grid, standard size
  function showChoicePage() {
    const header = document.getElementById('panel-header');
    const panel = document.getElementById('panel-content');

    header.innerHTML = `
      <div class="demo-panel-header">
        <div>
          <h2>Add Asset</h2>
          <p>Select which type of asset to add</p>
        </div>
        <button class="demo-back-btn" onclick="goBack()">← Back</button>

  function checkForDuplicateAsset(assetData) {
    // Check if VIN or Truck # already exists
    const existingAssets = loadAssetsFromLocalStorage();
    const vin = assetData.vin?.toLowerCase().trim();
    const truckNum = assetData.unit?.toLowerCase().trim();

    for (let asset of existingAssets) {
      if (asset.data) {
        const existingVin = asset.data.vin?.toLowerCase().trim();
        const existingTruckNum = asset.data.unit?.toLowerCase().trim();

        if (vin && vin === existingVin) {
          return { isDuplicate: true, field: 'vin', message: 'VIN already exists' };
        }
        if (truckNum && truckNum === existingTruckNum) {
          return { isDuplicate: true, field: 'unit', message: 'Truck # already exists' };
        }
      }
    }
    return { isDuplicate: false };
  }

  function highlightDuplicateField(assetIndex, fieldName) {
    const input = document.querySelector(`input[data-asset="${assetIndex}"][data-field="${fieldName}"]`);
    if (input) {

      input.style.boxShadow = '0 0 8px rgba(211, 47, 47, 0.5)';
      input.style.backgroundColor = '#ffebee';

  function saveAssetCard(assetIndex) {
    const inputs = document.querySelectorAll(`input[data-asset="${assetIndex}"]`);
    const data = {};
    let hasData = false;

    inputs.forEach(input => {
      data[input.dataset.field] = input.value;
      if (input.value) hasData = true;
    });

    if (hasData) {
      // Check for duplicates
      const dupCheck = checkForDuplicateAsset(data);
      if (dupCheck.isDuplicate) {
        alert(`Error: ${dupCheck.message}\n\nPlease enter a different value.`);
        highlightDuplicateField(assetIndex, dupCheck.field);
        return;
      }

      // Save only this asset (not all completed ones)
      const existingAssets = loadAssetsFromLocalStorage();
      existingAssets.push({
        type: assetFormState.assetTypes[assetIndex],
        label: assetFormState.assetLabels[assetIndex],
        data: data,
        savedAt: new Date().toISOString()
      });
      localStorage.setItem("rigpmproAssets", JSON.stringify(existingAssets));

      assetFormState.data[assetIndex] = data;
      assetFormState.completed[assetIndex] = true;

  // Dates are stored as ISO (YYYY-MM-DD, required by <input type="date">) but
  // displayed as mm/dd/yyyy wherever shown as read-only text.
  function formatDateMMDDYYYY(isoDateStr) {
    if (!isoDateStr) return '';
    const parts = isoDateStr.split('-');
    if (parts.length !== 3) return isoDateStr;
    const [year, month, day] = parts;
    return `${month}/${day}/${year}`;
  }

  // ===== PM Info (Preventive Maintenance interval tracking) =====

  // APU/Reefer run on hours; Truck/Trailer run on odometer miles.
  function pmReadingUnit(assetType) {
    return (assetType === 'APU' || assetType === 'Reefer') ? 'Hours' : 'Miles';
  }

  // Default per-item "due soon" warning threshold, scaled to unit type. User can edit per item.
  function pmDefaultThreshold(assetType) {
    return (assetType === 'APU' || assetType === 'Reefer') ? 250 : 10000;
  }

  // Default maintenance category names only - no preloaded intervals.
  // User sources and enters their own interval numbers.
  // Lists are tailored per asset type since a truck's PM items don't apply to
  // an APU or trailer. User can always add/edit/remove items regardless of type.
  function getDefaultPMItemNames(assetType) {
    switch (assetType) {
      case 'APU':
        return ['PM'];
      case 'Trailer':
        return ['Annual DOT Inspection'];
      case 'Reefer':
        return ['PM', 'EGR Cleaning'];
      default: // Truck
        return [
          'Oil Change', 'Chassis Lube', 'Air Filter', 'Fuel Filter',
          'Coolant Flush', 'Transmission Service', 'Brake Inspection',
          'DPF Cleaning', 'DEF Filter Replacement', 'Air Dryer Cartridge',
          'Annual DOT Inspection'
        ];
    }
  }

  // Determine if a PM item is date-based (Annual DOT Inspection) or mileage-based
  function getItemIntervalType(itemName) {
    return itemName === 'Annual DOT Inspection' ? 'days' : 'mileage';
  }

  function ensurePMItemsInitialized(asset) {
    const defaultThreshold = pmDefaultThreshold(asset.type);
    if (!asset.data.pmItems) {
      asset.data.pmItems = getDefaultPMItemNames(asset.type).map((name, i) => {
        const intervalType = getItemIntervalType(name);
        const item = {
          id: 'pm-' + Date.now() + '-' + i,
          name: name,
          interval: intervalType === 'days' ? '365' : '',
          dateCompleted: '',
          readingAtCompletion: '',
          dueSoonThreshold: intervalType === 'days' ? '60' : defaultThreshold,
          interval_type: intervalType
        };
        return item;
      });
    } else {
      // Backfill threshold and interval_type on items saved before this feature existed
      asset.data.pmItems.forEach((item) => {
        if (item.dueSoonThreshold === undefined) item.dueSoonThreshold = pmDefaultThreshold(asset.type);
        if (item.interval_type === undefined) item.interval_type = getItemIntervalType(item.name);
      });
    }
  }

  // Per-item warning: OVERDUE (past due) > DUE SOON (within the item's own threshold) > OK
  // Each item carries its own threshold since different maintenance items may need
  // different warning windows (e.g. brakes vs. an air dryer cartridge).
  // Supports both MILEAGE-BASED (oil change, etc.) and DATE-BASED (Annual DOT Inspection)
  function calculatePMStatus(item, currentReading) {
    const interval = parseFloat(item.interval);
    const intervalType = item.interval_type || 'mileage';

    // DATE-BASED ITEMS (Annual DOT Inspection)
    if (intervalType === 'days') {
      const dateCompleted = item.dateCompleted ? new Date(item.dateCompleted) : null;

      if (!dateCompleted || isNaN(dateCompleted.getTime()) || isNaN(interval)) {
        return { nextDueAt: null, remaining: null, status: 'NOT SET' };
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      dateCompleted.setHours(0, 0, 0, 0);

      const nextDueAt = new Date(dateCompleted);
      nextDueAt.setDate(nextDueAt.getDate() + interval);

      const daysRemaining = Math.floor((nextDueAt - today) / (1000 * 60 * 60 * 24));
      const dueSoonThreshold = parseFloat(item.dueSoonThreshold);

      let status;
      if (daysRemaining < 0) {
        status = 'OVERDUE';
      } else if (!isNaN(dueSoonThreshold) && daysRemaining <= dueSoonThreshold) {
        status = 'DUE SOON';
      } else {
        status = 'OK';
      }

      return {
        nextDueAt: nextDueAt.toISOString().split('T')[0],
        remaining: daysRemaining,
        status: status,
        unit: 'days'
      };
    }

    // MILEAGE-BASED ITEMS (Oil Change, etc.)
    const readingAtCompletion = parseFloat(item.readingAtCompletion);
    const current = parseFloat(currentReading);

    if (isNaN(interval) || isNaN(readingAtCompletion)) {
      return { nextDueAt: null, remaining: null, status: 'NOT SET' };
    }

    const nextDueAt = readingAtCompletion + interval;

    if (isNaN(current)) {
      return { nextDueAt: nextDueAt, remaining: null, status: 'NO READING' };
    }

    const remaining = nextDueAt - current;
    const dueSoonThreshold = parseFloat(item.dueSoonThreshold);

    let status;
    if (remaining < 0) {
      status = 'OVERDUE';
    } else if (!isNaN(dueSoonThreshold) && remaining <= dueSoonThreshold) {
      status = 'DUE SOON';
    } else {
      status = 'OK';
    }

    return { nextDueAt: nextDueAt, remaining: remaining, status: status, unit: 'miles' };
  }

  function pmStatusColor(status) {
    switch (status) {
      case 'OVERDUE': return '#ff4d4d';
      case 'DUE SOON': return '#e8741c';
      case 'OK': return '#4caf50';
      default: return 'var(--muted)';
    }
  }

  function showPMSchedule(index) {
    const header = document.getElementById('panel-header');
    const panel = document.getElementById('panel-content');
    const assets = loadAssetsFromLocalStorage();
    const asset = assets[index];
    if (!asset) { showPMInfoEntry(); return; }

    ensurePMItemsInitialized(asset);
    saveAssetsToLocalStorage(assets);

    const unitLabel = pmReadingUnit(asset.type);
    const currentReading = asset.data.currentReading;

    header.innerHTML = `
      <div class="demo-panel-header">
        <div>
          <h2>${asset.label} - PM Schedule</h2>
          <p>Current ${unitLabel}: ${currentReading || 'not set'}</p>
        </div>
        <button class="demo-back-btn" onclick="showPMInfoEntry()">← Back</button>
      </div>
    `;

    let html = `<div style='padding: 16px;'>`;

    html += `<div style='margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap;'>
      <button onclick="showPMReadingInput(${index})" style='padding: 10px 16px; background: var(--blue); color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600;'>Update ${unitLabel} Reading</button>
      <button onclick="showAddPMItemForm(${index})" style='padding: 10px 16px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-weight: 600;'>+ Add Maintenance Item</button>
    </div>`;

    // Tally counts for the collapsed summary line
    let okCount = 0, dueSoonCount = 0, overdueCount = 0;
    asset.data.pmItems.forEach((item) => {
      const status = calculatePMStatus(item, currentReading).status;
      if (status === 'OVERDUE') overdueCount++;
      else if (status === 'DUE SOON') dueSoonCount++;
      else if (status === 'OK') okCount++;
    });

    const isExpanded = window.pmListExpanded !== false; // default expanded

    html += `<div style='background: var(--soft); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; max-width: 560px; width: 100%;'>
      <div onclick="togglePMListExpanded(${index})" style='display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; cursor: pointer; gap: 12px;'>
        <div style='font-weight: 700;'>${asset.label} PM Items</div>

  function saveMaintenanceLog() {
    const assetIndex = document.getElementById("logAsset").value;
    const logType = document.getElementById("logType").value;
    const logDesc = document.getElementById("logDesc").value;
    const logDate = document.getElementById("logDate").value;
    const logMileage = document.getElementById("logMileage").value;
    const logVendor = document.getElementById("logVendor").value;
    const logCityState = document.getElementById("logCityState").value;
    const logCost = document.getElementById("logCost").value || '0';

    if (!assetIndex || !logType || !logDesc || !logDate || !logMileage || !logVendor || !logCityState) {
      alert('Please fill in all required fields');
      return;
    }

    // Get or create maintenance logs
    let logs = JSON.parse(localStorage.getItem("rigpmproMaintenanceLogs") || '[]');

    logs.push({
      assetIndex: parseInt(assetIndex),
      type: logType,
      description: logDesc,
      date: logDate,
      mileage: parseInt(logMileage),
      vendor: logVendor,
      cityState: logCityState,
      cost: parseFloat(logCost),
      savedAt: new Date().toISOString()
    });

    localStorage.setItem("rigpmproMaintenanceLogs", JSON.stringify(logs));
    
    // Show success and offer to add another
    logRepairShowForm = false;
    showLogRepairPM();
  }

              <tr style='border-bottom: 2px solid #FFFF00;'>
                <th style='padding: 8px; text-align: left; color: #FFFF00; font-weight: 700;'>Asset</th>
                <th style='padding: 8px; text-align: left; color: #FFFF00; font-weight: 700;'>Type</th>
                <th style='padding: 8px; text-align: center; color: #FFFF00; font-weight: 700;'>Count</th>
                <th style='padding: 8px; text-align: right; color: #FFFF00; font-weight: 700;'>Cost</th>
              </tr>
            </thead>
            <tbody>
      `;
      
      Object.values(totals).sort((a, b) => b.cost - a.cost).forEach(row => {
        html += `
          <tr style='border-bottom: 1px solid rgba(255, 255, 0, 0.2);'>
            <td style='padding: 8px;'>${row.asset}</td>
            <td style='padding: 8px; color: #FFFF00; font-weight: 700;'>${row.type}</td>
            <td style='padding: 8px; text-align: center;'>${row.count}</td>
            <td style='padding: 8px; text-align: right;'>$${row.cost.toFixed(2)}</td>
          </tr>
        `;
      });
      
      html += `</tbody></table></div>`;
    }
    
    html += `</div>`;
    panel.innerHTML = html;
  }

  function clearAssetCard(assetIndex) {
    document.querySelectorAll(`input[data-asset="${assetIndex}"]`).forEach(input => {
      input.value = '';
    });
  }

  function cancelAssetCard(assetIndex) {
    assetFormState.completed[assetIndex] = false;
    assetFormState.currentAsset = assetIndex - 1;
    showMultiAssetForm();
  }

  function handleMultiAssetSave() {
    // No longer used in new card-based flow
  }

  function openForm(action, title) {
    const header = document.getElementById('panel-header');
    const panel = document.getElementById('panel-content');

    if (action === 'add-asset' || action === 'edit-asset') {
      if (window.innerWidth <= 767) {
        currentAssetAction = action;
        showChoicePage();
      } else {
        currentAssetAction = action;
        showMultiAssetForm();
      }
      return;
    }

    if (action === 'view-assets') {
      showViewAssets();
      return;
    }

    if (action === 'log-repair') {
      showLogRepairPM();
      return;
    }

    if (action === 'repair-history') {
      showRepairHistory();
      return;
    }

    if (action === 'total-costs') {
      showTotalCosts();
      return;
    }

    header.innerHTML = `
      <div class="demo-panel-header">
        <div>
          <h2>${title}</h2>
          <p>Enter your information below</p>
        </div>
        <button class="demo-back-btn" onclick="goBack()">← Back</button>
      </div>
    `;

    let formHtml = `
      <div class="demo-form">
        <form onsubmit="event.preventDefault(); alert('Data saved successfully!')">
    `;

    if (action === 'log-pm' || action === 'log-repair') {
      formHtml += `
        <div class="demo-form-group">
          <label>Asset</label>
          <select required>
            <option>Select asset...</option>
            <option>Truck - 2020 Peterbilt</option>
            <option>Trailer - 2019 Wabash</option>
            <option>APU - Thermo King</option>
            <option>Reefer - Carrier</option>
          </select>
        </div>
        <div class="demo-form-group">
          <label>Task/Repair Description</label>
          <input type="text" placeholder="Oil change, brake service, etc." required>
        </div>
        <div class="demo-form-group">
          <label>Date Completed</label>
          <input type="date" required>
        </div>
        <div class="demo-form-group">
          <label>Cost</label>
          <input type="number" placeholder="0.00" step="0.01" required>
        </div>
        <div class="demo-form-group">
          <label>Notes</label>
          <input type="text" placeholder="Additional notes (optional)">
        </div>
      `;
    } else {
      formHtml += `
        <div class="demo-form-group">
          <label>Information Field</label>
          <input type="text" placeholder="Enter details" required>
        </div>
        <div class="demo-form-group">
          <label>Additional Details</label>
          <input type="text" placeholder="More information" required>
        </div>
      `;
    }

    formHtml += `
          <div class="demo-form-buttons">
            <button type="submit" class="demo-save-btn">Save</button>
            <button type="button" class="demo-cancel-btn" onclick="goBack()">Cancel</button>
          </div>
        </form>
      </div>
    `;

    panel.innerHTML = formHtml;
  }

  function goBack() {
    // Reset form state when user backs out
    assetFormState.initialized = false;
    if (previousCategory) {
      // Just go back to previous screen - don't auto-open the menu.
      // Menu only opens via the explicit Open/Close toggle button.
      if (previousCategory === 'pminfo') {
        showPMInfoEntry();
      } else {
        showPlacards(previousCategory);
      }
    }
  }

  function exitDemo() {
    window.location.href = '/';
  }

  // Swipe gesture to open menu
  let touchStartX = 0;
  document.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  });

  document.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].clientX;
    const swipeDistance = touchEndX - touchStartX;

    // Swipe from left edge to right (>50px) opens menu
    if (touchStartX < 20 && swipeDistance > 50) {
      showMenu();
    }
  });

  window.addEventListener('load', () => {
    initMenuState();
    selectCategory('pminfo');
  });
</script>

</body>
</html>
