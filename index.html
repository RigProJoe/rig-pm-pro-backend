<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig PM Pro Demo | Asset & Maintenance Tracker</title>
<style>
  :root {
    --ink: #eef2f7;
    --muted: #b6c0cc;
    --paper: #11161c;
    --soft: #1a212a;
    --line: #2d3742;
    --blue: #1d4f91;
    --orange: #e8741c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
  }

  .demo-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .demo-header {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .demo-header h1 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
  }

  .demo-exit-btn {
    background: var(--blue);
    color: #fff;
    border: 0;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  .demo-exit-btn:hover { opacity: 0.9; }

  .demo-content {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .demo-sidebar {
    width: 200px;
    background: var(--soft);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 12px 0;
  }

  .demo-nav-btn {
    width: 100%;
    padding: 12px 16px;
    border: 0;
    background: none;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    font-size: 0.95rem;
    border-left: 3px solid transparent;
    transition: background 0.2s;
  }

  .demo-nav-btn:hover { background: var(--line); }

  .demo-nav-btn.active {
    background: var(--line);
    border-left-color: var(--orange);
    font-weight: 600;
  }

  .demo-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .demo-panel-header {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .demo-panel-header h2 {
    margin: 0 0 6px;
    font-size: 1.3rem;
  }

  .demo-panel-header p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .demo-back-btn {
    background: var(--blue);
    color: #fff;
    border: 0;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
  }

  .demo-back-btn:hover { opacity: 0.9; }

  .demo-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
    min-height: 0;
  }

  .demo-placards {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(2, 1fr);
  }

  .demo-placard {
    background: linear-gradient(135deg, var(--soft) 0%, rgba(26, 33, 42, 0.8) 100%);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 100px;
  }

  .demo-placard:hover {
    border-color: var(--orange);
    background: linear-gradient(135deg, var(--line) 0%, var(--soft) 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(232, 116, 28, 0.2);
  }

  .demo-placard-title {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 4px;
    color: #fff;
  }

  .demo-placard-desc {
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.3;
  }

  .demo-form {
    max-width: 600px;
    margin: 0 auto;
  }

  .demo-form-group {
    margin-bottom: 18px;
  }

  .demo-form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .demo-form-group input,
  .demo-form-group select {
    width: 100%;
    padding: 10px 12px;
    background: var(--soft);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
  }

  .asset-form-section {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    align-items: flex-end;
  }

  .asset-form-section h3 {
    grid-column: 1 / -1;
    margin: 0 0 8px;
    font-size: 1.1rem;
    color: var(--orange);
    border-bottom: 2px solid var(--line);
    padding-bottom: 12px;
  }

  .asset-form-section .demo-form-group {
    margin-bottom: 0;
  }

  .asset-form-section .demo-form-group label {
    font-size: 0.75rem;
    margin-bottom: 4px;
  }

  .asset-form-section .demo-form-group input {
    padding: 8px;
    font-size: 0.9rem;
  }

  .demo-form-group input:focus,
  .demo-form-group select:focus {
    outline: none;
    border-color: var(--orange);
  }

  .demo-form-buttons {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .demo-save-btn {
    background: var(--orange);
    color: #fff;
    border: 0;
    padding: 12px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    flex: 1;
  }

  .demo-save-btn:hover { opacity: 0.9; }

  .demo-cancel-btn {
    background: transparent;
    color: var(--orange);
    border: 2px solid var(--orange);
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  .demo-cancel-btn:hover { background: rgba(232, 116, 28, 0.1); }

  .asset-choice-container {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(2, 1fr);
    max-width: 600px;
    margin: 0 auto;
  }

  .asset-choice-btn {
    background: linear-gradient(135deg, var(--soft) 0%, rgba(26, 33, 42, 0.8) 100%);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    min-height: 120px;
    color: var(--ink);
    font-weight: 600;
    font-size: 1.1rem;
  }

  .asset-choice-btn:hover {
    border-color: var(--orange);
    background: linear-gradient(135deg, var(--line) 0%, var(--soft) 100%);
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(232, 116, 28, 0.3);
  }

  .asset-cards-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  .asset-card {
    background: var(--soft);
    border: 2px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    transition: all 0.3s ease;
  }

  .asset-card-active {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(232, 116, 28, 0.2);
  }

  .asset-card-completed {
    background: rgba(100, 120, 140, 0.3);
    opacity: 0.6;
  }

  .asset-card h3 {
    margin: 0 0 10px;
    font-size: 1.1rem;
    color: var(--orange);
    border-bottom: 2px solid var(--line);
    padding-bottom: 12px;
  }

  .asset-card-content {
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .form-field {
    margin-bottom: 8px;
  }

  .form-field label {
    display: block;
    margin-bottom: 3px;
    font-weight: 600;
    font-size: 0.75rem;
    color: var(--ink);
  }

  .form-field input {
    width: 100%;
    max-width: 100px;
    padding: 6px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.9rem;
  }

  .form-field input:focus {
    outline: none;
    border-color: var(--orange);
  }

  .form-field input:disabled {
    background: var(--line);
    opacity: 0.5;
    cursor: not-allowed;
  }

  .asset-card-buttons {
    display: flex;
    gap: 6px;
  }

  .btn-save, .btn-clear, .btn-cancel {
    flex: 1;
    padding: 6px;
    border: 0;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-save {
    background: var(--orange);
    color: #fff;
  }

  .btn-save:hover:not(:disabled) {
    opacity: 0.9;
  }

  .btn-save:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-clear {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--muted);
  }

  .btn-clear:hover:not(:disabled) {
    color: var(--ink);
    border-color: var(--ink);
  }

  .btn-clear:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-cancel {
    background: transparent;
    color: var(--orange);
    border: 1px solid var(--orange);
  }

  .btn-cancel:hover {
    background: rgba(232, 116, 28, 0.1);
  }

  .multi-asset-form {
    display: grid;
    gap: 32px;
    grid-template-columns: repeat(2, 1fr);
  }

  .asset-form-section {
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
  }

  .asset-form-section h3 {
    margin: 0 0 16px;
    font-size: 1.1rem;
    color: var(--orange);
    border-bottom: 2px solid var(--line);
    padding-bottom: 12px;
  }

  @media (min-width: 900px) {
    .demo-placards { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 899px) {
    .multi-asset-form {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 480px) {
    .demo-sidebar { width: 120px; }
    .demo-nav-btn { padding: 10px 12px; font-size: 0.9rem; }
    .demo-header h1 { font-size: 1rem; }
    .demo-placards { grid-template-columns: 1fr; }
    .demo-placard { min-height: 90px; padding: 12px; }
    .demo-placard-title { font-size: 0.95rem; margin-bottom: 2px; }
    .demo-placard-desc { font-size: 0.75rem; }
    .asset-choice-container { gap: 12px; }
    .asset-choice-btn { min-height: 100px; padding: 16px; font-size: 1rem; }
  }
</style>
</head>
<body>

<div class="demo-container">
  <div class="demo-header">
    <h1>Rig PM Pro Demo</h1>
    <button class="demo-exit-btn" onclick="exitDemo()">Exit Demo</button>
  </div>

  <div class="demo-content">
    <div class="demo-sidebar">
      <button class="demo-nav-btn active" onclick="selectCategory('assets')">Assets</button>
      <button class="demo-nav-btn" onclick="selectCategory('maintenance')">Maintenance</button>
      <button class="demo-nav-btn" onclick="selectCategory('account')">Account Settings</button>
    </div>

    <div class="demo-main">
      <div id="panel-header"></div>
      <div class="demo-area" id="panel-content"></div>
    </div>
  </div>
</div>

<script>
  let previousCategory = null;

  const categories = {
    assets: {
      title: 'Assets',
      desc: 'Manage your trucks, trailers, APU, and reefer units',
      placards: [
        { title: 'Add Asset', desc: 'Add a new truck, trailer, APU, or reefer to track', action: 'add-asset' },
        { title: 'Edit Asset', desc: 'Update details for your existing equipment', action: 'edit-asset' },
        { title: 'View All Assets', desc: 'See all your equipment in one place', action: 'view-assets' },
        { title: 'Asset History', desc: 'View maintenance history by asset', action: 'asset-history' }
      ]
    },
    maintenance: {
      title: 'Maintenance',
      desc: 'Log and track preventive maintenance across all assets',
      placards: [
        { title: 'Log PM', desc: 'Record a completed preventive maintenance task', action: 'log-pm' },
        { title: 'Log Repair', desc: 'Log an unplanned repair or service', action: 'log-repair' },
        { title: 'Repair History', desc: 'View all repairs by asset or date', action: 'repair-history' },
        { title: 'Total Costs', desc: 'See maintenance spending by month, quarter, or year', action: 'total-costs' }
      ]
    },
    account: {
      title: 'Account Settings',
      desc: 'Manage your account, billing, and preferences',
      placards: [
        { title: 'Profile', desc: 'Update your name, email, and contact information', action: 'profile' },
        { title: 'Billing & Subscription', desc: 'Manage your plan, payment method, and receipts', action: 'billing' },
        { title: 'Preferences', desc: 'Set notifications, export options, and display preferences', action: 'preferences' },
        { title: 'Support', desc: 'Contact support or view documentation', action: 'support' }
      ]
    }
  };

  function selectCategory(cat) {
    previousCategory = cat;

    document.querySelectorAll('.demo-nav-btn').forEach(btn => {
      btn.classList.remove('active');
      if (btn.textContent.toLowerCase() === cat.toLowerCase()) {
        btn.classList.add('active');
      }
    });

    showPlacards(cat);
  }

  function showPlacards(cat) {
    const content = categories[cat];
    const header = document.getElementById('panel-header');
    const panel = document.getElementById('panel-content');

    header.innerHTML = `
      <div class="demo-panel-header">
        <div>
          <h2>${content.title}</h2>
          <p>${content.desc}</p>
        </div>
      </div>
    `;

    let html = '<div class="demo-placards">';
    content.placards.forEach(p => {
      html += `
        <div class="demo-placard" onclick="openForm('${p.action}', '${p.title}')">
          <div class="demo-placard-title">${p.title}</div>
          <div class="demo-placard-desc">${p.desc}</div>
        </div>
      `;
    });
    html += '</div>';

    panel.innerHTML = html;
  }

  let currentAssetAction = null;

  function showChoicePage() {
    const header = document.getElementById('panel-header');
    const panel = document.getElementById('panel-content');

    header.innerHTML = `
      <div class="demo-panel-header">
        <div>
          <h2>Add Asset</h2>
          <p>Select which type of asset to add</p>
        </div>
        <button class="demo-back-btn" onclick="goBack()">← Back</button>
      </div>
    `;

    panel.innerHTML = `
      <div class="asset-choice-container">
        <button class="asset-choice-btn" onclick="saveAsset('truck')">Save Truck</button>
        <button class="asset-choice-btn" onclick="saveAsset('apu')">Save APU</button>
        <button class="asset-choice-btn" onclick="saveAsset('trailer')">Save Trailer</button>
        <button class="asset-choice-btn" onclick="saveAsset('reefer')">Save Reefer</button>
      </div>
    `;
  }

  function saveAsset(assetType) {
    const header = document.getElementById('panel-header');
    const panel = document.getElementById('panel-content');

    const assetLabels = {
      truck: 'Truck',
      apu: 'APU',
      trailer: 'Trailer',
      reefer: 'Reefer'
    };

    const assetLabel = assetLabels[assetType] || 'Asset';

    header.innerHTML = `
      <div class="demo-panel-header">
        <div>
          <h2>Add ${assetLabel}</h2>
          <p>Enter your ${assetLabel.toLowerCase()} details</p>
        </div>
        <button class="demo-back-btn" onclick="showChoicePage()">← Back</button>
      </div>
    `;

    panel.innerHTML = `
      <div class="demo-form">
        <form onsubmit="event.preventDefault(); handleAssetSave('${assetType}')">
          <div class="demo-form-group">
            <label>Make/Model</label>
            <input type="text" placeholder="e.g., Peterbilt 579" required>
          </div>
          <div class="demo-form-group">
            <label>Year</label>
            <input type="number" placeholder="2020" required>
          </div>
          <div class="demo-form-group">
            <label>VIN</label>
            <input type="text" placeholder="Last 6 digits" required>
          </div>
          <div class="demo-form-group">
            <label>Unit #</label>
            <input type="number" placeholder="Unit number" required>
          </div>
          <div class="demo-form-buttons">
            <button type="submit" class="demo-save-btn">Save ${assetLabel}</button>
            <button type="button" class="demo-cancel-btn" onclick="showChoicePage()">Back</button>
          </div>
        </form>
      </div>
    `;
  }

  function handleAssetSave(assetType) {
    alert('Asset saved successfully!');
    showChoicePage();
  }

  let assetFormState = {
    currentAsset: 0,
    completed: [false, false, false, false],
    data: [{}, {}, {}, {}],
    assetTypes: ['truck', 'apu', 'trailer', 'reefer'],
    assetLabels: ['Truck', 'APU', 'Trailer', 'Reefer']
  };

  function showMultiAssetForm() {
    const header = document.getElementById('panel-header');
    const panel = document.getElementById('panel-content');

    header.innerHTML = `
      <div class="demo-panel-header">
        <div>
          <h2>Add Assets</h2>
          <p>Fill in asset details - complete one at a time</p>
        </div>
        <button class="demo-back-btn" onclick="goBack()">← Back</button>
      </div>
    `;

    assetFormState.currentAsset = 0;
    assetFormState.completed = [false, false, false, false];
    assetFormState.data = [{}, {}, {}, {}];

    let cardsHtml = '<div class="asset-cards-grid">';

    for (let i = 0; i < 4; i++) {
      const isActive = i === assetFormState.currentAsset;
      const isCompleted = assetFormState.completed[i];
      const shadeClass = isCompleted ? 'asset-card-completed' : '';
      const displayClass = isActive ? 'asset-card-active' : '';

      cardsHtml += `
        <div class="asset-card ${shadeClass} ${displayClass}" id="asset-card-${i}">
          <h3>${assetFormState.assetLabels[i]}</h3>
          <div class="asset-card-content">
            <div class="form-field">
              <label>Year</label>
              <input type="number" class="asset-field" data-asset="${i}" data-field="year" placeholder="2020" ${isCompleted ? 'disabled' : ''}>
            </div>
            <div class="form-field">
              <label>Make</label>
              <input type="text" class="asset-field" data-asset="${i}" data-field="make" placeholder="Make" maxlength="25" ${isCompleted ? 'disabled' : ''}>
            </div>
            <div class="form-field">
              <label>Model</label>
              <input type="text" class="asset-field" data-asset="${i}" data-field="model" placeholder="Model" maxlength="25" ${isCompleted ? 'disabled' : ''}>
            </div>
            <div class="form-field">
              <label>Unit #</label>
              <input type="text" class="asset-field" data-asset="${i}" data-field="unit" placeholder="Unit #" maxlength="10" ${isCompleted ? 'disabled' : ''}>
            </div>
            <div class="form-field">
              <label>VIN #</label>
              <input type="text" class="asset-field" data-asset="${i}" data-field="vin" placeholder="VIN #" maxlength="10" ${isCompleted ? 'disabled' : ''}>
            </div>
          </div>
          <div class="asset-card-buttons">
            <button type="button" class="btn-save" onclick="saveAssetCard(${i})" ${isCompleted ? 'disabled' : ''}>Save</button>
            <button type="button" class="btn-clear" onclick="clearAssetCard(${i})" ${isCompleted ? 'disabled' : ''}>Clear</button>
            ${i > 0 ? `<button type="button" class="btn-cancel" onclick="cancelAssetCard(${i})">Cancel</button>` : ''}
          </div>
        </div>
      `;
    }

    cardsHtml += '</div>';
    panel.innerHTML = cardsHtml;
  }

  function saveAssetCard(assetIndex) {
    const inputs = document.querySelectorAll(`input[data-asset="${assetIndex}"]`);
    const data = {};
    let hasData = false;

    inputs.forEach(input => {
      data[input.dataset.field] = input.value;
      if (input.value) hasData = true;
    });

    if (hasData) {
      assetFormState.data[assetIndex] = data;
      assetFormState.completed[assetIndex] = true;

      // Save to localStorage
      saveAssetsToLocalStorage();

      if (assetIndex === 3) {
        // All done - go back to view assets
        alert('All assets saved successfully!');
        goBack();
      } else {
        // Move to next card
        assetFormState.currentAsset = assetIndex + 1;
        showMultiAssetForm();
      }
    } else {
      alert('Please fill in at least one field');
    }

  function saveAssetsToLocalStorage() {
    const assets = [];
    assetFormState.assetTypes.forEach((type, index) => {
      if (assetFormState.completed[index] && Object.keys(assetFormState.data[index]).length > 0) {
        assets.push({
          type: type,
          label: assetFormState.assetLabels[index],
          data: assetFormState.data[index],
          savedAt: new Date().toISOString()
        });
      }
    });
    localStorage.setItem("rigpmproAssets", JSON.stringify(assets));
  }

  function loadAssetsFromLocalStorage() {
    const stored = localStorage.getItem("rigpmproAssets");
    return stored ? JSON.parse(stored) : [];
  }

  function showViewAssets() {
    const header = document.getElementById("panel-header");
    const panel = document.getElementById("panel-content");

    header.innerHTML = `
      <div class="demo-panel-header">
        <div>
          <h2>Saved Assets</h2>
          <p>Your saved equipment and assets</p>
        </div>
        <button class="demo-back-btn" onclick="goBack()">← Back</button>
      </div>
    `;

    const assets = loadAssetsFromLocalStorage();
    
    if (assets.length === 0) {
      panel.innerHTML = "<div style='padding: 40px; text-align: center; color: var(--muted);'>No assets saved yet. Add assets to see them here.</div>";
      return;
    }

    let html = "<div style='padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));'>";
    
    assets.forEach((asset, index) => {
      html += `
        <div style='background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 16px;'>
          <h3 style='margin: 0 0 12px; color: var(--orange); font-size: 1.1rem; border-bottom: 1px solid var(--line); padding-bottom: 8px;'>${asset.label}</h3>
          <div style='font-size: 0.9rem;'>
            ${asset.data.year ? `<div><strong>Year:</strong> ${asset.data.year}</div>` : ""}
            ${asset.data.make ? `<div><strong>Make:</strong> ${asset.data.make}</div>` : ""}
            ${asset.data.model ? `<div><strong>Model:</strong> ${asset.data.model}</div>` : ""}
            ${asset.data.unit ? `<div><strong>Unit #:</strong> ${asset.data.unit}</div>` : ""}
            ${asset.data.vin ? `<div><strong>VIN #:</strong> ${asset.data.vin}</div>` : ""}
          </div>
          <button onclick="deleteAsset(${index})" style='margin-top: 12px; width: 100%; padding: 8px; background: var(--line); border: 1px solid var(--orange); color: var(--orange); border-radius: 4px; cursor: pointer; font-weight: 600;'>Delete</button>
        </div>
      `;
    });
    
    html += "</div>";
    panel.innerHTML = html;
  }

  function deleteAsset(index) {
    const assets = loadAssetsFromLocalStorage();
    assets.splice(index, 1);
    localStorage.setItem("rigpmproAssets", JSON.stringify(assets));
    showViewAssets();
  }
  }

  function clearAssetCard(assetIndex) {
    document.querySelectorAll(`input[data-asset="${assetIndex}"]`).forEach(input => {
      input.value = '';
    });
  }

  function cancelAssetCard(assetIndex) {
    assetFormState.completed[assetIndex] = false;
    assetFormState.currentAsset = assetIndex - 1;
    showMultiAssetForm();
  }

  function handleMultiAssetSave() {
    // No longer used in new card-based flow
  }

  function openForm(action, title) {
    const header = document.getElementById('panel-header');
    const panel = document.getElementById('panel-content');

    if (action === 'add-asset' || action === 'edit-asset') {
      if (window.innerWidth <= 767) {
        currentAssetAction = action;
        showChoicePage();
      } else {
        currentAssetAction = action;
        showMultiAssetForm();
      }
      return;
    }

    if (action === 'view-assets') {
      showViewAssets();
      return;
    }

    header.innerHTML = `
      <div class="demo-panel-header">
        <div>
          <h2>${title}</h2>
          <p>Enter your information below</p>
        </div>
        <button class="demo-back-btn" onclick="goBack()">← Back</button>
      </div>
    `;

    let formHtml = `
      <div class="demo-form">
        <form onsubmit="event.preventDefault(); alert('Data saved successfully!')">
    `;

    if (action === 'log-pm' || action === 'log-repair') {
      formHtml += `
        <div class="demo-form-group">
          <label>Asset</label>
          <select required>
            <option>Select asset...</option>
            <option>Truck - 2020 Peterbilt</option>
            <option>Trailer - 2019 Wabash</option>
            <option>APU - Thermo King</option>
            <option>Reefer - Carrier</option>
          </select>
        </div>
        <div class="demo-form-group">
          <label>Task/Repair Description</label>
          <input type="text" placeholder="Oil change, brake service, etc." required>
        </div>
        <div class="demo-form-group">
          <label>Date Completed</label>
          <input type="date" required>
        </div>
        <div class="demo-form-group">
          <label>Cost</label>
          <input type="number" placeholder="0.00" step="0.01" required>
        </div>
        <div class="demo-form-group">
          <label>Notes</label>
          <input type="text" placeholder="Additional notes (optional)">
        </div>
      `;
    } else {
      formHtml += `
        <div class="demo-form-group">
          <label>Information Field</label>
          <input type="text" placeholder="Enter details" required>
        </div>
        <div class="demo-form-group">
          <label>Additional Details</label>
          <input type="text" placeholder="More information" required>
        </div>
      `;
    }

    formHtml += `
          <div class="demo-form-buttons">
            <button type="submit" class="demo-save-btn">Save</button>
            <button type="button" class="demo-cancel-btn" onclick="goBack()">Cancel</button>
          </div>
        </form>
      </div>
    `;

    panel.innerHTML = formHtml;
  }

  function goBack() {
    if (previousCategory) {
      showPlacards(previousCategory);
    }
  }

  function exitDemo() {
    window.location.href = '/';
  }

  window.addEventListener('load', () => {
    selectCategory('assets');
  });
</script>

</body>
</html>
