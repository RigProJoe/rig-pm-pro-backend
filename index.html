<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig PM Pro Demo | Asset & Maintenance Tracker</title>
<meta name="description" content="Demo of Rig PM Pro - track preventive maintenance for your truck, APU, trailer, and reefer.">
<style>
  :root {
    --ink: #eef2f7;
    --muted: #b6c0cc;
    --paper: #11161c;
    --soft: #1a212a;
    --line: #2d3742;
    --blue: #1d4f91;
    --orange: #e8741c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
  }

  main { display: block; }

  .demo-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: var(--paper);
    color: var(--ink);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .demo-header {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .demo-header h1 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
  }

  .demo-back {
    background: var(--blue);
    color: #fff;
    border: 0;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .demo-back:hover {
    opacity: 0.9;
  }

  /* Main content area */
  .demo-content {
    display: flex;
    flex: 1;
    overflow: hidden;
    gap: 0;
  }

  /* Left category menu */
  .demo-categories {
    width: 200px;
    background: var(--soft);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 12px 0;
  }

  .demo-category-item {
    padding: 12px 16px;
    border: 0;
    background: none;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    font-size: 0.95rem;
    border-left: 3px solid transparent;
    transition: background 0.2s;
  }

  .demo-category-item:hover {
    background: var(--line);
  }

  .demo-category-item.active {
    background: var(--line);
    border-left-color: var(--orange);
    font-weight: 600;
  }

  /* Right content panel */
  .demo-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .demo-panel-header {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    padding: 16px;
  }

  .demo-panel-header h2 {
    margin: 0 0 8px;
    font-size: 1.3rem;
  }

  .demo-panel-header p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .demo-content-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .demo-cards {
    display: grid;
    gap: 12px;
    grid-template-columns: 1fr;
  }

  .demo-card {
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    font-size: 0.95rem;
  }

  .demo-card-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 8px;
  }

  .demo-card-title {
    font-weight: 600;
    color: var(--ink);
  }

  .demo-card-status {
    background: var(--blue);
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .demo-card-meta {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 6px 0;
  }

  .demo-btn {
    background: var(--orange);
    color: #fff;
    border: 0;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    margin-top: 8px;
  }

  .demo-btn:hover {
    opacity: 0.9;
  }

  /* Empty state */
  .demo-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    text-align: center;
  }

  /* Account settings form */
  .demo-form-group {
    margin-bottom: 16px;
  }

  .demo-form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 0.9rem;
  }

  .demo-form-group input,
  .demo-form-group select {
    width: 100%;
    padding: 8px 12px;
    background: var(--soft);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.9rem;
  }

  .demo-form-group input:focus,
  .demo-form-group select:focus {
    outline: none;
    border-color: var(--orange);
  }

  .demo-save-btn {
    background: var(--blue);
    color: #fff;
    border: 0;
    padding: 10px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    margin-top: 12px;
  }

  .demo-save-btn:hover {
    opacity: 0.9;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .demo-categories {
      width: 150px;
    }

    .demo-header {
      padding: 12px;
    }

    .demo-header h1 {
      font-size: 1.2rem;
    }

    .demo-panel-header {
      padding: 12px;
    }

    .demo-content-area {
      padding: 12px;
    }
  }

  @media (max-width: 480px) {
    .demo-categories {
      width: 120px;
    }

    .demo-category-item {
      padding: 10px 12px;
      font-size: 0.9rem;
    }

    .demo-header h1 {
      font-size: 1rem;
    }

    .demo-back {
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .demo-card {
      padding: 12px;
    }

    .demo-panel-header h2 {
      font-size: 1.1rem;
    }
  }
</style>
</head>
<body>

<div class="demo-container">
  <!-- Header -->
  <div class="demo-header">
    <h1>Rig PM Pro Demo</h1>
    <button class="demo-back" onclick="exitDemo()">Exit Demo</button>
  </div>

  <!-- Main Content -->
  <div class="demo-content">
    <!-- Left Category Menu -->
    <div class="demo-categories">
      <button class="demo-category-item active" onclick="selectCategory('assets')">Assets</button>
      <button class="demo-category-item" onclick="selectCategory('maintenance')">Maintenance</button>
      <button class="demo-category-item" onclick="selectCategory('account')">Account Settings</button>
    </div>

    <!-- Right Content Panel -->
    <div class="demo-panel">
      <div id="panel-content"></div>
    </div>
  </div>
</div>

<script>
  const demoContent = {
    assets: {
      title: 'Assets',
      desc: 'Your trucks, trailers, APU, and reefer units',
      content: `
        <div class="demo-panel-header">
          <h2>Assets</h2>
          <p>Your trucks, trailers, APU, and reefer units</p>
        </div>
        <div class="demo-content-area">
          <div class="demo-cards">
            <div class="demo-card">
              <div class="demo-card-header">
                <div class="demo-card-title">Truck - 2020 Peterbilt 579</div>
                <div class="demo-card-status">Active</div>
              </div>
              <div class="demo-card-meta">
                <strong>VIN:</strong> 1XPBD49X0LD...<br>
                <strong>Unit #:</strong> 1<br>
                <strong>Engine:</strong> Cummins X15
              </div>
            </div>
            <div class="demo-card">
              <div class="demo-card-header">
                <div class="demo-card-title">Trailer - 2019 Wabash 53ft</div>
                <div class="demo-card-status">Active</div>
              </div>
              <div class="demo-card-meta">
                <strong>VIN:</strong> 1JJV532A7KL...<br>
                <strong>Unit #:</strong> 2
              </div>
            </div>
            <div class="demo-card">
              <div class="demo-card-header">
                <div class="demo-card-title">APU - Thermo King SB3000</div>
                <div class="demo-card-status">Active</div>
              </div>
              <div class="demo-card-meta">
                <strong>Model:</strong> SB3000<br>
                <strong>Unit #:</strong> 3
              </div>
            </div>
            <div class="demo-card">
              <div class="demo-card-header">
                <div class="demo-card-title">Reefer Unit - Carrier</div>
                <div class="demo-card-status">Active</div>
              </div>
              <div class="demo-card-meta">
                <strong>Model:</strong> Refrigerated<br>
                <strong>Unit #:</strong> 4
              </div>
            </div>
          </div>
        </div>
      `
    },
    maintenance: {
      title: 'Maintenance',
      desc: 'Track preventive maintenance across all assets',
      content: `
        <div class="demo-panel-header">
          <h2>Maintenance</h2>
          <p>Track preventive maintenance across all assets</p>
        </div>
        <div class="demo-content-area">
          <div class="demo-cards">
            <div class="demo-card">
              <div class="demo-card-header">
                <div class="demo-card-title">Oil Change - Truck</div>
                <div class="demo-card-status">Due</div>
              </div>
              <div class="demo-card-meta">
                <strong>Interval:</strong> Every 15,000 miles<br>
                <strong>Days remaining:</strong> 5 days
              </div>
              <button class="demo-btn" onclick="alert('Maintenance logged')">Log Completed</button>
            </div>
            <div class="demo-card">
              <div class="demo-card-header">
                <div class="demo-card-title">Brake Inspection - Trailer</div>
                <div class="demo-card-status">Due Soon</div>
              </div>
              <div class="demo-card-meta">
                <strong>Interval:</strong> Every 6 months<br>
                <strong>Days remaining:</strong> 12 days
              </div>
              <button class="demo-btn" onclick="alert('Maintenance logged')">Log Completed</button>
            </div>
            <div class="demo-card">
              <div class="demo-card-header">
                <div class="demo-card-title">Belt Check - APU</div>
                <div class="demo-card-status">Due</div>
              </div>
              <div class="demo-card-meta">
                <strong>Interval:</strong> Every 3 months<br>
                <strong>Days remaining:</strong> 1 day
              </div>
              <button class="demo-btn" onclick="alert('Maintenance logged')">Log Completed</button>
            </div>
            <div class="demo-card">
              <div class="demo-card-header">
                <div class="demo-card-title">Condenser Clean - Reefer</div>
                <div class="demo-card-status">OK</div>
              </div>
              <div class="demo-card-meta">
                <strong>Interval:</strong> Every 6 months<br>
                <strong>Days remaining:</strong> 120 days
              </div>
              <button class="demo-btn" onclick="alert('Maintenance logged')">Log Completed</button>
            </div>
          </div>
        </div>
      `
    },
    account: {
      title: 'Account Settings',
      desc: 'Manage your account and preferences',
      content: `
        <div class="demo-panel-header">
          <h2>Account Settings</h2>
          <p>Manage your account and preferences</p>
        </div>
        <div class="demo-content-area">
          <form onsubmit="event.preventDefault(); alert('Settings saved')">
            <div class="demo-form-group">
              <label>Full Name</label>
              <input type="text" value="John Doe" readonly>
            </div>
            <div class="demo-form-group">
              <label>Email</label>
              <input type="email" value="john@example.com" readonly>
            </div>
            <div class="demo-form-group">
              <label>MC Number</label>
              <input type="text" value="155269" readonly>
            </div>
            <div class="demo-form-group">
              <label>Subscription Plan</label>
              <select disabled>
                <option>Truck Only - $5/month</option>
                <option>Truck + Trailer - $9/month</option>
                <option>Fleet (4+ units) - Custom pricing</option>
              </select>
            </div>
            <div class="demo-form-group">
              <label>Billing Cycle</label>
              <select disabled>
                <option>Monthly</option>
                <option>Annual (Save 10%)</option>
              </select>
            </div>
            <button type="submit" class="demo-save-btn">Save Changes</button>
          </form>
        </div>
      `
    }
  };

  function selectCategory(category) {
    // Update active button
    document.querySelectorAll('.demo-category-item').forEach(btn => {
      btn.classList.remove('active');
      if (btn.textContent.toLowerCase() === category.toLowerCase()) {
        btn.classList.add('active');
      }
    });

    // Render content
    const panelContent = document.getElementById('panel-content');
    panelContent.innerHTML = demoContent[category].content;
  }

  function exitDemo() {
    window.location.href = '/';
  }

  // Initialize with Assets category on load
  window.addEventListener('load', () => {
    selectCategory('assets');
  });
</script>

</body>
</html>
