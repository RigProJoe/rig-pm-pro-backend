<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig PM Pro Demo | Asset & Maintenance Tracker</title>
<meta name="description" content="Demo of Rig PM Pro - track preventive maintenance for your truck, APU, trailer, and reefer.">
<style>
  :root {
    --ink: #eef2f7;
    --muted: #b6c0cc;
    --paper: #11161c;
    --soft: #1a212a;
    --line: #2d3742;
    --blue: #1d4f91;
    --orange: #e8741c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
  }

  main { display: block; }

  .demo-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: var(--paper);
    color: var(--ink);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .demo-header {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .demo-header h1 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
  }

  .demo-back {
    background: var(--blue);
    color: #fff;
    border: 0;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .demo-back:hover {
    opacity: 0.9;
  }

  /* Main content area */
  .demo-content {
    display: flex;
    flex: 1;
    overflow: hidden;
    gap: 0;
  }

  /* Sidebar menu */
  .demo-sidebar {
    width: 200px;
    background: var(--soft);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 12px 0;
  }

  .demo-menu-item {
    padding: 12px 16px;
    border: 0;
    background: none;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    font-size: 0.95rem;
    border-left: 3px solid transparent;
    transition: background 0.2s;
  }

  .demo-menu-item:hover {
    background: var(--line);
  }

  .demo-menu-item.active {
    background: var(--line);
    border-left-color: var(--orange);
    font-weight: 600;
  }

  /* Main panel */
  .demo-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .demo-panel-header {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    padding: 16px;
  }

  .demo-panel-header h2 {
    margin: 0 0 8px;
    font-size: 1.3rem;
  }

  .demo-panel-header p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .demo-cards {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: grid;
    gap: 12px;
    grid-template-columns: 1fr;
  }

  .demo-card {
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    font-size: 0.95rem;
  }

  .demo-card-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 8px;
  }

  .demo-card-title {
    font-weight: 600;
    color: var(--ink);
  }

  .demo-card-status {
    background: var(--blue);
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .demo-card-meta {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 6px 0;
  }

  .demo-btn {
    background: var(--orange);
    color: #fff;
    border: 0;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    margin-top: 8px;
  }

  .demo-btn:hover {
    opacity: 0.9;
  }

  /* Export card */
  .export-card {
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin: 16px;
  }

  .export-card h3 {
    margin: 0 0 12px;
    font-size: 1.1rem;
  }

  .export-btn {
    background: var(--orange);
    color: #fff;
    border: 0;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  .export-btn:hover {
    opacity: 0.9;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .demo-sidebar {
      width: 150px;
    }

    .demo-header {
      padding: 12px;
    }

    .demo-header h1 {
      font-size: 1.2rem;
    }

    .demo-panel-header {
      padding: 12px;
    }

    .demo-cards {
      padding: 12px;
    }
  }

  @media (max-width: 480px) {
    .demo-sidebar {
      width: 120px;
    }

    .demo-menu-item {
      padding: 10px 12px;
      font-size: 0.9rem;
    }

    .demo-header h1 {
      font-size: 1rem;
    }

    .demo-back {
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .demo-card {
      padding: 12px;
    }

    .demo-panel-header h2 {
      font-size: 1.1rem;
    }
  }

  /* Hidden start menu */
  #demo-start-screen {
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
  }

  #demo-start-screen h2 {
    font-size: 1.5rem;
    margin-bottom: 12px;
  }

  #demo-start-screen p {
    color: var(--muted);
    margin-bottom: 20px;
  }

  .demo-menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 300px;
  }

  .demo-menu-btn {
    background: var(--blue);
    color: #fff;
    border: 0;
    padding: 12px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 1rem;
  }

  .demo-menu-btn:hover {
    opacity: 0.9;
  }
</style>
</head>
<body>

<div class="demo-container">
  <!-- Header -->
  <div class="demo-header">
    <h1>Rig PM Pro Demo</h1>
    <button class="demo-back" onclick="exitDemo()">Exit Demo</button>
  </div>

  <!-- Main Content -->
  <div class="demo-content">
    <!-- Sidebar -->
    <div class="demo-sidebar">
      <button class="demo-menu-item active" onclick="selectAsset('truck')">Truck</button>
      <button class="demo-menu-item" onclick="selectAsset('trailer')">Trailer</button>
      <button class="demo-menu-item" onclick="selectAsset('apu')">APU</button>
      <button class="demo-menu-item" onclick="selectAsset('reefer')">Reefer</button>
    </div>

    <!-- Main Panel -->
    <div class="demo-main">
      <!-- Start Screen -->
      <div id="demo-start-screen" style="display: flex;">
        <h2>Welcome to Rig PM Pro Demo</h2>
        <p>Select an asset from the menu to view maintenance items</p>
        <div class="demo-menu-buttons">
          <button class="demo-menu-btn" onclick="selectAsset('truck')">View Truck</button>
          <button class="demo-menu-btn" onclick="selectAsset('trailer')">View Trailer</button>
          <button class="demo-menu-btn" onclick="selectAsset('apu')">View APU</button>
          <button class="demo-menu-btn" onclick="selectAsset('reefer')">View Reefer</button>
        </div>
      </div>

      <!-- Asset View (hidden initially) -->
      <div id="demo-asset-view" style="display: none; flex: 1; flex-direction: column; overflow: hidden;">
        <div class="demo-panel-header">
          <h2 id="asset-title">Truck</h2>
          <p id="asset-desc">Truck maintenance items and history</p>
        </div>
        <div class="demo-cards" id="cards-container"></div>
      </div>
    </div>
  </div>

  <!-- Export Card -->
  <div class="export-card">
    <h3>Export Maintenance Records</h3>
    <button class="export-btn" onclick="exportData()">Download CSV</button>
  </div>
</div>

<script>
  const demoData = {
    truck: {
      title: 'Truck - 2020 Peterbilt 579',
      desc: 'Main truck maintenance tracking',
      items: [
        { task: 'Oil Change', interval: 'Every 15,000 miles', status: 'Due', days: 5 },
        { task: 'Filter Change', interval: 'Every 15,000 miles', status: 'OK', days: 120 },
        { task: 'Tire Rotation', interval: 'Every 20,000 miles', status: 'Due Soon', days: 12 },
        { task: 'Transmission Fluid', interval: 'Every 50,000 miles', status: 'OK', days: 250 }
      ]
    },
    trailer: {
      title: 'Trailer - 2019 Wabash 53ft',
      desc: 'Trailer maintenance and inspection',
      items: [
        { task: 'Brake Inspection', interval: 'Every 6 months', status: 'OK', days: 90 },
        { task: 'Light Check', interval: 'Every month', status: 'Due', days: 2 },
        { task: 'Tire Pressure Check', interval: 'Weekly', status: 'OK', days: 6 },
        { task: 'Coupling Grease', interval: 'Every 6 months', status: 'Due Soon', days: 14 }
      ]
    },
    apu: {
      title: 'APU - Thermo King SB3000',
      desc: 'Auxiliary Power Unit maintenance',
      items: [
        { task: 'Oil Change', interval: 'Every 500 hours', status: 'OK', days: 180 },
        { task: 'Filter Change', interval: 'Every 500 hours', status: 'OK', days: 180 },
        { task: 'Belt Inspection', interval: 'Every 250 hours', status: 'Due', days: 3 },
        { task: 'Coolant Top-up', interval: 'Every year', status: 'Due Soon', days: 20 }
      ]
    },
    reefer: {
      title: 'Reefer Unit - Carrier Refrigerated',
      desc: 'Refrigerated unit maintenance',
      items: [
        { task: 'Condenser Clean', interval: 'Every 6 months', status: 'OK', days: 120 },
        { task: 'Compressor Oil', interval: 'Every year', status: 'Due Soon', days: 25 },
        { task: 'Belt Check', interval: 'Every 3 months', status: 'Due', days: 1 },
        { task: 'Thermostat Check', interval: 'Every month', status: 'OK', days: 15 }
      ]
    }
  };

  function selectAsset(assetType) {
    // Hide start screen, show asset view
    document.getElementById('demo-start-screen').style.display = 'none';
    document.getElementById('demo-asset-view').style.display = 'flex';

    // Update active menu item
    document.querySelectorAll('.demo-menu-item').forEach(btn => {
      btn.classList.remove('active');
    });
    event.target.classList.add('active');

    // Update asset info
    const data = demoData[assetType];
    document.getElementById('asset-title').textContent = data.title;
    document.getElementById('asset-desc').textContent = data.desc;

    // Render cards
    const container = document.getElementById('cards-container');
    container.innerHTML = '';
    data.items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'demo-card';
      card.innerHTML = `
        <div class="demo-card-header">
          <div class="demo-card-title">${item.task}</div>
          <div class="demo-card-status">${item.status}</div>
        </div>
        <div class="demo-card-meta">
          <strong>Interval:</strong> ${item.interval}<br>
          <strong>Days remaining:</strong> ${item.days}
        </div>
        <button class="demo-btn" onclick="alert('Logged: ' + this.parentElement.querySelector('.demo-card-title').textContent)">Log Completed</button>
      `;
      container.appendChild(card);
    });
  }

  function exportData() {
    const csvContent = [
      ['Asset', 'Task', 'Interval', 'Status', 'Days Remaining'],
      ['Truck - 2020 Peterbilt 579', 'Oil Change', 'Every 15,000 miles', 'Due', '5'],
      ['Truck - 2020 Peterbilt 579', 'Filter Change', 'Every 15,000 miles', 'OK', '120'],
      ['Trailer - 2019 Wabash 53ft', 'Brake Inspection', 'Every 6 months', 'OK', '90'],
      ['APU - Thermo King SB3000', 'Oil Change', 'Every 500 hours', 'OK', '180'],
      ['Reefer Unit - Carrier', 'Condenser Clean', 'Every 6 months', 'OK', '120']
    ];

    const csv = csvContent.map(row => row.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rig-pm-maintenance-' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    window.URL.revokeObjectURL(url);
  }

  function exitDemo() {
    window.location.href = '/';
  }
</script>

</body>
</html>
